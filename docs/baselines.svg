<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="bl-title bl-desc">
<title id="bl-title">Baseline arms: accuracy vs. adjacent substitution rate</title>
<desc id="bl-desc">Scatter of the four scored baselines. No language model has been evaluated on this corpus yet; the upper-right region where a strong, low-error system would land has no points.</desc>
<style>:root{color-scheme:light dark}svg{background:var(--surface,#FFFFFF)}.axis-line{stroke:var(--rule,#101311);stroke-width:1}.grid-line{stroke:var(--rule-soft,#D6D7CE);stroke-width:1}.tick-label{font:11px var(--font-mono,monospace);fill:var(--muted,#666D68)}.axis-label{font:12px var(--font-sans,sans-serif);fill:var(--ink-2,#3A403C)}.arm-label{font:12px var(--font-sans,sans-serif);fill:var(--ink,#101311)}.hatch-label{font:11px var(--font-mono,monospace);fill:var(--muted,#666D68)}.ci-bar{stroke:var(--ink-2,#3A403C);stroke-width:1.5}@media (prefers-color-scheme: dark){svg{background:var(--surface,#12151C)}.axis-line{stroke:var(--rule,#EAECF2)}.grid-line{stroke:var(--rule-soft,#262B36)}.tick-label{fill:var(--muted,#838A99)}.axis-label{fill:var(--ink-2,#BFC4CF)}.arm-label{fill:var(--ink,#EAECF2)}.hatch-label{fill:var(--muted,#838A99)}.ci-bar{stroke:var(--ink-2,#BFC4CF)}}</style>
