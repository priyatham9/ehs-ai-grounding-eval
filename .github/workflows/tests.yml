name: tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Run tests
        run: python -m unittest discover -s tests -v
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check .
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas coverage
      - name: Run tests with coverage
        run: coverage run -m unittest discover -s tests -t .
      - name: Generate coverage report
        run: coverage report -m >> $GITHUB_STEP_SUMMARY
